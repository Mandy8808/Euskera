name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"

      - name: Compile Python sources
        run: python -m compileall euskera

      - name: Import canonical namespaces
        run: |
          python - <<'PY'
          import importlib

          namespaces = (
              "euskera",
              "euskera.backgrounds",
              "euskera.core",
              "euskera.evolution",
              "euskera.io",
              "euskera.models",
              "euskera.observables",
              "euskera.tools",
              "euskera.visualization",
          )
          for namespace in namespaces:
              importlib.import_module(namespace)
          print(f"Imported {len(namespaces)} canonical namespaces")
          PY

      - name: Run tests
        run: python -m pytest

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ".[test,notebooks,fftw]"
      - name: Analytic checks with both FFT backends
        run: python -m pytest tests/test_scientific_regressions.py -q
      - name: Download workflow notebooks from Git LFS
        run: git lfs pull --include="examples/workflows/*.ipynb" --exclude=""
      - name: Execute workflow notebooks
        run: python scripts/run_notebook_smoke.py --output-dir notebook-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-results
          path: notebook-results/
