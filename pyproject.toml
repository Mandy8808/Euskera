[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "euskera"
version = "1.1.0"
description = "Numerical time evolution for Schrodinger-Poisson and Gross-Pitaevskii-Poisson systems"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.txt"}
dependencies = [
    "cycler",
    "h5py",
    "ipython",
    "matplotlib",
    "numba",
    "numexpr",
    "numpy",
    "pandas",
    "scipy",
]

[project.optional-dependencies]
fftw = ["pyfftw"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["euskera*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
markers = [
    "scientific: small numerical validation and resolution-comparison tests",
]
